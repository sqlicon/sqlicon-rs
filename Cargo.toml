[package]
name = "sqlicon-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "rt", "rt-multi-thread", "time"] }
tracing = "0.1"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

